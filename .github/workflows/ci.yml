name: Clovo CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 1. Backend Verification (FastAPI, Python, Docker)
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: uv sync

      - name: Verify Routes & FastAPI App
        run: uv run python -c "from main import app; print('FastAPI loaded successfully with route count:', len(app.routes))"

      - name: Verify Backend Dockerfile Build
        run: docker build -t clovo-server:test .

  # 2. Mobile Verification (React Native, Expo, TypeScript)
  mobile-ci:
    name: Mobile CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Client/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./Client/mobile/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit
