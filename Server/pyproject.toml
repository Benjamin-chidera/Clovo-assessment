[project]
name = "server"
version = "0.1.0"
description = "Clovo Real-Time Backend API Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-socketio>=5.11.0",
    "sqlmodel>=0.0.22",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "redis>=5.0.8",
    "hiredis>=3.0.0",
    "sentry-sdk[fastapi]>=2.13.0",
    "langchain-ollama>=1.1.0",
    "langfuse>=2.59.0,<3.0.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]


